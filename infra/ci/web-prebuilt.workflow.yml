# PROPOSTA, NÃO ATIVA. Para ativar: copiar para .github/workflows/web-prebuilt.yml num PR do PM (.github não é pasta desta frente) e fixar as ações por SHA de commit (hoje por tag: não verifiquei os SHAs).
# Constrói o `.next` do web NUM LINUX, em /app (o mesmo caminho absoluto da Vertra), com as variáveis do release.json, e entrega o pacote PRÉ-CONSTRUÍDO (build vazio na Vertra) como artefato.
# Por que: o .next embute APP_ENV e a URL do build e não é portátil entre sistemas (o do Windows tem caminhos do host); construir na Vertra exige 2048 MB, que o regime de produção (7552 de 8192) não comporta.
# Sem segredos: nenhum `secrets.` aqui; só dispara à mão (workflow_dispatch), nunca por PR; permissão só de leitura; as entradas passam por variáveis de ambiente e são validadas, nunca interpoladas em script.
# Pré-requisito: o commit já está no GitHub (push do PM) e contém infra/scripts/package-prebuilt.mjs e lib/prebuilt.mjs (ft/infra-prebuilt integrada).
name: web-prebuilt

on:
  workflow_dispatch:
    inputs:
      commit:
        description: SHA de 40 caracteres do commit a construir (já enviado ao GitHub)
        required: true
        type: string
      perfil:
        description: staging ou production
        required: true
        type: choice
        options:
          - staging
          - production
      subdominio:
        description: subdominio na Vertra (loyaltynews-stg no staging; loyaltynews na producao)
        required: true
        type: string
      flags:
        description: flags de produto (so staging), separadas por virgula, ex intelligencePessoas
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: web-prebuilt-${{ inputs.perfil }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LN_COMMIT: ${{ inputs.commit }}
      LN_PERFIL: ${{ inputs.perfil }}
      LN_SUBDOMINIO: ${{ inputs.subdominio }}
      LN_FLAGS: ${{ inputs.flags }}
    steps:
      - name: Validar as entradas
        run: |
          set -euo pipefail
          [[ "$LN_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit precisa ter 40 hexadecimais minusculos"; exit 1; }
          [[ "$LN_PERFIL" == "staging" || "$LN_PERFIL" == "production" ]] || { echo "perfil invalido"; exit 1; }
          [[ "$LN_SUBDOMINIO" =~ ^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$ ]] || { echo "subdominio invalido"; exit 1; }
          [[ -z "$LN_FLAGS" || "$LN_FLAGS" =~ ^[A-Za-z][A-Za-z0-9]*(,[A-Za-z][A-Za-z0-9]*)*$ ]] || { echo "flags fora do formato"; exit 1; }
          if [[ "$LN_PERFIL" == "production" && -n "$LN_FLAGS" ]]; then echo "producao nao aceita flags por variavel (ADR-022)"; exit 1; fi

      - name: Código do commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Conferir que o checkout é o commit pedido
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LN_COMMIT"

      - name: Versão do Node da Vertra
        id: node
        run: |
          set -euo pipefail
          echo "versao=$(node -p "require('./infra/vertra/environments.json').runtime.node")" >> "$GITHUB_OUTPUT"

      - name: Node igual ao da Vertra
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.versao }}

      - name: Pacote do web do mesmo commit (package-web)
        run: |
          set -euo pipefail
          ARGS=(--repo . --commit "$LN_COMMIT" --out /tmp/pacote --profile "$LN_PERFIL" --subdomain "$LN_SUBDOMINIO")
          if [[ -n "$LN_FLAGS" ]]; then ARGS+=(--flags "$LN_FLAGS"); fi
          node infra/scripts/package-web.mjs "${ARGS[@]}"
          PASTA="$(ls -d /tmp/pacote/ln-web-*/ | head -1)"
          echo "PASTA=${PASTA%/}" >> "$GITHUB_ENV"

      - name: Construir em /app (mesmo caminho absoluto da Vertra)
        run: |
          set -euo pipefail
          sudo mkdir -p /app
          sudo chown "$USER" /app
          cp -a "$PASTA"/. /app/
          cd /app
          npm ci
          APP_ENV="$(node -p "require('./release.json').appEnv")"
          SITE="$(node -p "require('./release.json').siteUrl")"
          export APP_ENV NODE_ENV=production APP_COMMIT="$LN_COMMIT" PORTAL_SOURCE=api
          export NEXT_PUBLIC_SITE_URL="$SITE" APP_URL="$SITE" BETTER_AUTH_URL="$SITE"
          if [[ -n "$LN_FLAGS" ]]; then export LN_FLAGS_ON="$LN_FLAGS"; fi
          node infra/scripts/guard-env.mjs
          node infra/scripts/build-web.mjs
          test -s apps/web/.next/BUILD_ID

      - name: Pacote pré-construído (build vazio na Vertra)
        run: |
          set -euo pipefail
          node infra/scripts/package-prebuilt.mjs --pacote "$PASTA" --next /app/apps/web/.next --out /tmp/saida --origem "github-actions run ${GITHUB_RUN_ID} em ${GITHUB_REPOSITORY}@${LN_COMMIT}" --sem-zip

      - name: Soma de integridade da árvore
        run: |
          set -euo pipefail
          cd /tmp/saida/ln-web-*-prebuilt
          find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print "arvore-sha256=" $1}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artefato
        uses: actions/upload-artifact@v4
        with:
          name: web-prebuilt-${{ inputs.perfil }}-${{ inputs.commit }}
          path: /tmp/saida/
          retention-days: 7
          if-no-files-found: error
