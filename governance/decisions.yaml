    "efeito": "TEXTO PROPOSTO pelo Program Manager e pela LN Security (não são palavras digitadas pelo proprietário); vale só se ele assinar este ato com a chave raiz. A D06 (autonomia de publicação desde o lançamento) e a D08 (imagem da fonte, com edição mínima) não são alteradas; a V21-08 (fundamento jurídico documentado antes de usar imagem) é revista somente no limite escrito na DP-99 e continua valendo para qualquer outro uso de imagem. EXCEÇÃO TEMPORÁRIA à ordem da R4-13, que continua pendente, assim como o gate R0-12: autoriza um robô aprovador de matérias do portal e robôs auditores, cada um com identidade própria e marcada como automática, nos termos abaixo. APRENDIZADO: 15 dias corridos, uma única vez, sem prorrogação, sem pausa e sem recomeço. INÍCIO: o instante da primeira decisão registrada pelo robô na produção, depois de ele estar construído, com revisão independente do código, ordem escrita do Program Manager e data e hora gravadas no servidor; ensaio no ambiente de teste não conta. Para começar já precisam estar prontos: a identidade própria, a recusa pelo servidor a publicar e a mudar o estado de qualquer matéria, a parada, o registro de cada decisão com o motivo e a credencial como na condição (6). Durante o aprendizado o robô só lê e registra o que faria e por quê, publicacaoAutonoma fica desligada na produção e regra sem prova conta como não publicar. Se o aprendizado não começar em até 60 dias corridos da data do commit raiz deste ato, a exceção caduca. PUBLICAÇÃO: os 30 dias corridos da exceção contam do fim do aprendizado e não se estendem. O robô passa a publicar sozinho, sem ação do proprietário por matéria, somente com todas as condições, controles, freios e auditores abaixo prontos e provados; se algum faltar ao fim dos 15 dias, ou deixar de valer depois, ele não publica (na dúvida, não publica), o prazo continua correndo e não há prorrogação nem novo aprendizado. O servidor recusa publicação do robô antes do fim do aprendizado e depois do fim dos 30 dias; prazo novo exige ato novo. A publicação do robô exige a flag publicacaoAutonoma liberada por commit revisado (no ambiente de teste com DP-97; na produção com DP-96), além de publicacaoPortal (DP-76); usar a rota de uma pessoa para o robô é proibido. ALCANCE: sem limite diário, o robô publica toda matéria que passar em todas as verificações; não há obrigação nem permissão de publicar a que não passar. SENSÍVEIS (DP-98): matéria com item de risco K1 a K9 ou termo da lista T também sai, somente com a CHECAGEM REFORÇADA inteira: todo fato apoiado em fonte primária citada, com link; acusação, investigação, processo ou fato negativo atribuídos a quem os afirma, sem declarar culpa, com a posição da parte citada quando houver fonte pública e, quando não houver, dizendo que não foi localizada; nenhuma recomendação própria de compra ou investimento; um segundo checador, distinto e de provedor diferente do da redação, confirmando 100% das afirmações; dado pessoal só quando necessário ao fato e vindo de fonte primária pública, listado com a fonte; sem imagem. Continuam impedindo a publicação: K10 (fonte só secundária ou blog), K11 (contrapartida, parceria paga, afiliado ou cupom), K12 (outro assunto sensível ou qualquer dúvida), qualquer item K sem resposta ou incerto, e as listas Q e H. BLOQUEIOS LEGAIS, sempre, sem exceção, e na dúvida bloqueia: qualquer identificação de criança ou adolescente (nome, imagem, apelido, iniciais, endereço, escola ou parente que identifique), porque o robô não confere autorização e a lei protege em especial quem é suspeito de ato infracional ou vítima; identificação de vítima de crime sexual ou violência, ou de testemunha protegida; CPF, documento, endereço, telefone, e-mail ou dado bancário; dado sobre saúde, origem racial, religião, opinião política, filiação, vida sexual, genética ou biometria de pessoa identificada; conteúdo sob segredo de justiça, sigiloso ou obtido por vazamento; discurso discriminatório; propaganda ou pesquisa eleitoral fora da lei; e qualquer outra vedação legal. Esta lista não esgota a lei. Matéria bloqueada ou devolvida vai ao Program Manager, com um revisor, em até 24 horas, e não é publicada pelo robô sem nova avaliação com todas as respostas positivas. IMAGEM: só a que acompanha a própria matéria da fonte citada, como veio, aceitando apenas redimensionar, recortar e comprimir, com crédito e link para a fonte, sem retirar marca ou crédito. O uso sem fundamento jurídico documentado e sem parecer prévio vale só nos termos da DP-99. O robô publica SEM imagem quando: a origem ou o crédito forem incertos; for de agência ou banco de imagens ou tiver marca d'água de terceiro; mostrar pessoa identificável, criança, documento, tela ou outro dado pessoal; ou houver pedido de retirada. Imagem criada por inteligência artificial não está autorizada. Pedido de retirada de imagem é atendido em até 1 hora, inclusive no cache, sem esperar análise. Limite conhecido e aceito somente com a assinatura: crédito e link não são licença do autor. CONDIÇÕES, todas obrigatórias antes da primeira publicação: (1) conta e identidade próprias, nunca administrador nem do proprietário, com papel novo que só lê matéria, emite recibo, muda a matéria para aprovado, bloqueado ou despublicado e publica; descartar correção, revisar movimentos e voltar a rascunho ficam negados no servidor; (2) no servidor, e não como instrução ao robô: parada que nasce ligada, os freios automáticos deste texto, bloqueio da conta que encerra a sessão aberta e despublicação testada, inclusive o cache; (3) o robô aprovador e os auditores não criam nem editam matéria, fonte, parecer, flag, usuário nem as próprias regras, que ficam em caminho protegido (este registro fixa a lista de elegibilidade versão 1, sha256 c499653daea1b940a61c6c8baec4b527fe1df8e0cdae428e24ab2a1632e36779, com apenas estas mudanças: R01 passa a ser a regra IMAGEM; G05 passa a ser os FREIOS; R04, R05 e R08 passam a ser a regra SENSÍVEIS com a CHECAGEM REFORÇADA e os BLOQUEIOS LEGAIS; outra mudança pede ato novo); (4) redação, checagem (e a segunda checagem nas sensíveis), revisão, aprovação e auditoria por agentes distintos, com as checagens em provedor diferente do da redação; item ausente ou ilegível significa não publicar; (5) não patrocinada; sensível só pela regra SENSÍVEIS; fora dela, sem dado pessoal além de nome e cargo públicos; bloqueios legais sempre; imagem só como na regra IMAGEM e nunca em matéria sensível; sem pedido de titular ou reclamação aberta; (6) credencial criada pelo proprietário no computador dele, nunca em chat, arquivo, log ou argumento, e nenhum script lê o cofre direto do disco; (7) aviso ao Program Manager a cada publicação e resumo diário; \"aprovada automaticamente\" visível no Studio e no recibo; nunca afirmar revisão humana; (8) ensaio no staging com um caso de cada bloqueio legal barrado, casos sensíveis sem o reforço barrados, erro plantado retirado pelos auditores e cada freio disparado de verdade, revisão independente do código e ordem do Program Manager para a produção; (9) auditoria depois da publicação funcionando, como abaixo. AUDITORIA: o servidor reconfere na hora da publicação o texto, a fonte, o link, o hash e a imagem; um auditor, agente distinto de todos os anteriores e de provedor diferente do da redação sempre que houver um disponível (se não houver, isso fica registrado e o Program Manager é avisado), avalia cada matéria em até 60 minutos (a sensível em até 15) e de novo até 24 horas depois. ERRO GRAVE: fato, número, data ou prazo sem apoio na fonte; fonte ou link errados; oferta vencida apresentada como válida; bloqueio legal descumprido; sensível sem a checagem reforçada; dado pessoal indevido; imagem fora da regra; matéria repetida ou inventada; afirmação de revisão humana. Erro grave: despublicação automática em até 5 minutos do achado, parada do robô e aviso ao Program Manager. ERRO LEVE (grafia ou formato que não muda o sentido): vira correção; a versão corrigida passa de novo por checagem, revisão e aprovação por agentes distintos, com nota pública de correção; sem versão aprovada em 4 horas, a matéria é despublicada. Nenhum robô altera texto publicado sem esse caminho. Dúvida do auditor conta como erro grave. Pedido de direito de resposta, de titular ou reclamação não é decidido por robô e segue os prazos da lei. FREIOS, no servidor, que ligam a parada: qualquer erro grave; nos 7 primeiros dias de publicação, também qualquer erro leve; depois, 3 erros leves nas últimas 20 matérias publicadas; auditoria sem resultado no prazo (para de publicar) e, passadas 6 horas sem resultado, a matéria é despublicada; mais de 10 publicações em 60 minutos ou menos de 2 minutos entre duas; divergência de hash, falha de registro, de aviso ou de despublicação; reclamação, pedido de titular ou caso de correção aberto (R10 a R12). Só o Program Manager libera a parada, por registro com a causa tratada e conferida por um revisor, nunca um robô; na terceira parada por erro grave em 7 dias, só o proprietário libera. O proprietário pode parar a qualquer momento. CONTROLES ANTES DA PRIMEIRA PUBLICAÇÃO (as regras da lista de elegibilidade valem sempre, com as mudanças acima, e regra sem prova significa não publicar): prontos no servidor, sem alternativa, G01, G02, G04, G07, G08, G10, P01, P04, R04, R08 (na forma desta entrada), os bloqueios legais, os freios e a despublicação automática; podem começar por registro ou campo simples e verificável, automatizados depois, G09, R07, R12 e R14 (a marca da R14 aparece no recibo e no Studio desde a primeira). Nada disto dispensa as 9 condições. R10 e R11 param o robô com qualquer pedido de titular ou caso de correção aberto, mesmo sem relação com a matéria. Enquanto as regras editoriais (A04) não rodarem também no caminho do CMS, o robô só publica matéria vinda da Fábrica. As provas P01 a P03, P05 e P07 são declaração de quem chama e não demonstram o fato. Aceito, só para estes robôs e nestes prazos,