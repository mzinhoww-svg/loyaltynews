    "data": "2026-11-27",
    "fonte": "proprietario (chat), registro do Program Manager",
    "efeito": "TEXTO PROPOSTO pelo Program Manager e pela LN Security (não são palavras digitadas pelo proprietário); vale só se ele assinar este ato com a chave raiz. editorialCollector: FLAG_RELEASES.editorialCollector = { staging: 'DP-94', production: 'DP-94' } e o nome em PRODUCTION_FLAGS_ON (packages/contracts/src/flags.ts), por commit revisado. Em produção é proibido ligar por variável (LN_FLAGS_ON ou LN_FACTORY_FLAGS), e o comando avulso editorial-factory não pode rodar em produção nem contra o banco de produção. ESCOPO: só coleta determinística de fontes públicas, repetida automaticamente pelo worker, guardando o item coletado e a evidência, sem duplicar. SEM modelo de IA (editorialPipeline e modelosHabilitados continuam desligadas); SEM provedor de leitura nem chave de API (leitorViaProvedor continua só no staging); SEM publicação no portal ou em rede social (esta decisão não muda publicacaoPortal, publicacaoAutonoma, linkedinPublicacao nem instagram); sem cadastrar pessoas (intelligencePessoas continua desligada em produção); sem despesa nova. CONDIÇÕES antes de ligar em produção: (1) só fontes habilitadas no Studio de produção por pessoa com permissão, com a revisão que o produto exige gravada, e a coleta relê o estado de cada fonte antes de coletá-la; (2) só o caminho direto, respeitando robots.txt e Crawl-delay, sem login, paywall ou contorno de CAPTCHA; o texto das fontes não é publicado nem reproduzido (DP-29); (3) parada de toda a coleta documentada, revisada e ensaiada; (4) cada rodada registrada com o resultado por fonte e aviso quando não houver rodada boa no prazo definido; (5) revisão independente do código, ensaio de 24 horas no staging medindo memória e banco, cópia do banco antes de qualquer migração, aval escrito da LN Security e ordem do Program Manager para a produção. \"Não parar mais\" vale como coleta automática contínua e não impede a parada de emergência nem o desligamento da chave. Ligar não é aceite de tarefa nem de gate. Pronto quando o worker de produção registrar a chave ligada na subida e a primeira rodada aparecer com o resultado por fonte.",
