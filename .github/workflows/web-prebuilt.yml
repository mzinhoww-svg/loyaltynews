# ATIVO (G3). Constrói o .next do web num Linux; ver infra/ci/LEIA-ME.md. Ações fixadas por SHA de commit (tags v4.2.2, v4.4.0, v4.6.2 conferidas com git ls-remote em 24/11/2026). SEM flags de produto: staging com flags NÃO é construído aqui (o ci-checks proíbe atribuir LN_FLAGS_ON em workflow, ADR-022).
# Constrói o `.next` do web NUM LINUX, em /app (o mesmo caminho absoluto da Vertra), com as variáveis do release.json, e entrega o pacote PRÉ-CONSTRUÍDO (build vazio na Vertra) como artefato.
# Entrega também o ZIP final de deploy; o número de aceite é o `zip-sha256` impresso no summary (o hash da árvore fica só como diagnóstico).
# Por que: o .next embute APP_ENV e a URL do build e não é portátil entre sistemas (o do Windows tem caminhos do host); construir na Vertra exige 2048 MB, que o regime de produção (7552 de 8192) não comporta.
# Sem segredos: nenhum `secrets.` aqui; só dispara à mão (workflow_dispatch), nunca por PR; permissão só de leitura; as entradas passam por variáveis de ambiente e são validadas, nunca interpoladas em script.
# Pré-requisito: o commit já está no GitHub (push do PM) e contém infra/scripts/package-prebuilt.mjs e lib/prebuilt.mjs (ft/infra-prebuilt integrada).
name: web-prebuilt

on:
  workflow_dispatch:
    inputs:
      commit:
        description: SHA de 40 caracteres do commit a construir (já enviado ao GitHub)
        required: true
        type: string
      perfil:
        description: staging ou production
        required: true
        type: choice
        options:
          - staging
          - production
      subdominio:
        description: subdominio na Vertra (loyaltynews-stg no staging; loyaltynews na producao)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-prebuilt-${{ inputs.perfil }}
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LN_COMMIT: ${{ inputs.commit }}
      LN_PERFIL: ${{ inputs.perfil }}
      LN_SUBDOMINIO: ${{ inputs.subdominio }}
    steps:
      - name: Validar as entradas
        run: |
          set -euo pipefail
          [[ "$LN_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit precisa ter 40 hexadecimais minusculos"; exit 1; }
          [[ "$LN_PERFIL" == "staging" || "$LN_PERFIL" == "production" ]] || { echo "perfil invalido"; exit 1; }
          [[ "$LN_SUBDOMINIO" =~ ^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$ ]] || { echo "subdominio invalido"; exit 1; }

      - name: Código do commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir que o checkout é o commit pedido
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LN_COMMIT"

      - name: Produção só constrói commit que já está na main (ancestral de origin/main)
        run: |
          set -euo pipefail
          if [[ "$LN_PERFIL" == "production" ]]; then
            # repositório público: o fetch anônimo basta (sem token na URL, sem credencial gravada); o histórico completo veio do checkout (fetch-depth 0)
            git fetch --no-tags origin main
            if git merge-base --is-ancestor "$LN_COMMIT" origin/main; then
              echo "ok: $LN_COMMIT é ancestral de origin/main ($(git rev-parse origin/main))"
            else
              rc=$?
              if [[ "$rc" -eq 1 ]]; then
                echo "RECUSADO: o commit $LN_COMMIT NÃO é ancestral da main. Produção só constrói commit que já foi para a main por PR revisado."
              else
                echo "ERRO ao conferir a ancestralidade (código $rc): não construo produção sem essa prova."
              fi
              exit 1
            fi
          fi

      - name: Versão do Node da Vertra
        id: node
        run: |
          set -euo pipefail
          echo "versao=$(node -p "require('./infra/vertra/environments.json').runtime.node")" >> "$GITHUB_OUTPUT"

      - name: Node igual ao da Vertra
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.node.outputs.versao }}

      - name: Pacote do web do mesmo commit (package-web)
        run: |
          set -euo pipefail
          ARGS=(--repo . --commit "$LN_COMMIT" --out /tmp/pacote --profile "$LN_PERFIL" --subdomain "$LN_SUBDOMINIO")
          node infra/scripts/package-web.mjs "${ARGS[@]}"
          PASTA="$(ls -d /tmp/pacote/ln-web-*/ | head -1)"
          echo "PASTA=${PASTA%/}" >> "$GITHUB_ENV"

      - name: Construir em /app (mesmo caminho absoluto da Vertra)
        run: |
          set -euo pipefail
          sudo mkdir -p /app
          sudo chown "$USER" /app
          cp -a "$PASTA"/. /app/
          cd /app
          npm ci
          APP_ENV="$(node -p "require('./release.json').appEnv")"
          SITE="$(node -p "require('./release.json').siteUrl")"
          export APP_ENV NODE_ENV=production APP_COMMIT="$LN_COMMIT" PORTAL_SOURCE=api
          export NEXT_PUBLIC_SITE_URL="$SITE" APP_URL="$SITE" BETTER_AUTH_URL="$SITE"
          node infra/scripts/guard-env.mjs
          node infra/scripts/build-web.mjs
          test -s apps/web/.next/BUILD_ID

      - name: Pacote pré-construído (build vazio na Vertra)
        run: |
          set -euo pipefail
          node infra/scripts/package-prebuilt.mjs --pacote "$PASTA" --next /app/apps/web/.next --out /tmp/saida --origem "github-actions run ${GITHUB_RUN_ID} em ${GITHUB_REPOSITORY}@${LN_COMMIT}" --sem-zip

      - name: ZIP final do deploy e sha256
        run: |
          set -euo pipefail
          PASTA_PB="$(ls -d /tmp/saida/ln-web-*-prebuilt | head -1)"
          command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip; }
          ZIP="${PASTA_PB}.zip"
          ( cd "$PASTA_PB" && zip -q -r -X "$ZIP" . )
          NFILES="$(find "$PASTA_PB" -type f | wc -l)"
          NZIP="$(unzip -Z1 "$ZIP" | grep -v '/$' | wc -l)"
          test "$NFILES" = "$NZIP"
          echo "zip=$(basename "$ZIP")" >> "$GITHUB_ENV"
          echo "$(basename "$ZIP") — ${NFILES} arquivos, $(stat -c%s "$ZIP") B" >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$ZIP" | awk '{print "zip-sha256=" $1}' | tee -a "$GITHUB_STEP_SUMMARY"
          # Diagnóstico: hash da árvore (não é o número de aceite).
          cd "$PASTA_PB"
          find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print "arvore-sha256=" $1}' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-prebuilt-${{ inputs.perfil }}-${{ inputs.commit }}
          path: /tmp/saida/
          retention-days: 7
          if-no-files-found: error
