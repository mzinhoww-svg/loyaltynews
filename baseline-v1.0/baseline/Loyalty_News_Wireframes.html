citário<\/h2><span><\/span><\/div><div class=\"diagram\"><div>Lead<\/div><span>→<\/span><div>Proposta<\/div><span>→<\/span><div>Contrato<\/div><span>→<\/span><div>Reserva de slot<\/div><span>→<\/span><div>Criativo aprovado<\/div><span>→<\/span><div>Entrega<\/div><span>→<\/span><div>Relatório<\/div><\/div><div class=\"sect\"><h2>Medição<\/h2><span><\/span><\/div><div class=\"diagram\"><div>GA4 / CMS / ESP<\/div><span>→<\/span><div>Workers server-side<\/div><span>→<\/span><div>Snapshots agregados<\/div><span>→<\/span><div>API pública cacheada<\/div><span>→<\/span><div>Mídia kit<\/div><\/div><div class=\"sect\"><h2>Arquitetura<\/h2><span><\/span><\/div><div class=\"diagram\"><div>Next.js / CDN<\/div><span>→<\/span><div>API + RBAC<\/div><span>→<\/span><div>Postgres + Storage<\/div><span>→<\/span><div>Fila durável<\/div><span>→<\/span><div>Workers + IA<\/div><span>→<\/span><div>Observabilidade<\/div><\/div><div class=\"sect\"><h2>Newsletter<\/h2><span><\/span><\/div><div class=\"diagram\"><div>Opt-in<\/div><span>→<\/span><div>Confirmação<\/div><span>→<\/span><div>Segmentação<\/div><span>→<\/span><div>Edição<\/div><span>→<\/span><div>Aprovação<\/div><span>→<\/span><div>Envio<\/div><span>→<\/span><div>Webhooks<\/div><\/div><div class=\"sect\"><h2>Direitos<\/h2><span><\/span><\/div><div class=\"diagram\"><div>Origem<\/div><span>→<\/span><div>Licença<\/div><span>→<\/span><div>Evidência<\/div><span>→<\/span><div>Crédito<\/div><span>→<\/span><div>Aprovação<\/div><span>→<\/span><div>Exibição<\/div><\/div><\/main>"}; const select=document.getElementById('screen');function go(key){if(!views[key])key='home';document.querySelector('.shell').innerHTML=views[key];select.value=key;location.hash=key;window.scrollTo(0,0);}select.addEventListener('change',()=>go(select.value));document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return;}const c=e.target.closest('[data-copy]');if(c){navigator.clipboard?.writeText(c.dataset.copy).catch(()=>{});alert('Link demonstrativo');}const pick=e.target.closest('[data-pick]');if(pick){document.querySelector('#offer').value=pick.dataset.pick;document.querySelector('#proposal').scrollIntoView({behavior:'smooth'});}});document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-go]'))go(e.target.dataset.go)});document.addEventListener('submit',e=>{if(e.target.matches('[data-demo]')){e.preventDefault();alert('Protótipo: nenhuma informação foi enviada ou armazenada.');}});document.addEventListener('input',e=>{if(e.target.id==='searchInput'){const q=e.target.value.toLowerCase();document.querySelectorAll('#searchResults .story').forEach(s=>s.hidden=!s.textContent.toLowerCase().includes(q));}});document.getElementById('mobile').onclick=()=>document.body.classList.toggle('mobile');window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==select.value&&views[location.hash.slice(1)])go(location.hash.slice(1))});go(location.hash.slice(1)||'home');</script></body></html>
